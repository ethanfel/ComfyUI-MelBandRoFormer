[project]
name = "ComfyUI-MelBandRoFormer"
description = "ComfyUI nodes for Mel-Band RoFormer and BS-RoFormer audio source separation — vocals, instruments, dereverb, denoise, and more"
version = "1.1.0"
license = "Apache-2.0"
dependencies = [
    "rotary-embedding-torch>=0.8.6",
    "einops>=0.8",
    "huggingface-hub>=0.34",
    "pyloudnorm>=0.2",
    "soundfile>=0.13",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/ethanfel/ComfyUI-MelBandRoFormer"
#  Used by Comfy Registry https://comfyregistry.org

[tool.setuptools]
packages = ["comfyui_melband_roformer", "comfyui_melband_roformer.model"]
package-dir = {"comfyui_melband_roformer" = ".", "comfyui_melband_roformer.model" = "model"}

[tool.comfy]
PublisherId = "ethanfel"
DisplayName = "ComfyUI-MelBandRoFormer"
Icon = ""
